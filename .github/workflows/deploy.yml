# Runs the full verify and publishes web/dist to GitHub Pages (ADR 0007).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components and wasm target.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # build-wasm.sh needs the wasm-bindgen CLI at the exact version pinned in crates/wasm.
      - name: Cache wasm-bindgen CLI
        id: wbg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ hashFiles('crates/wasm/Cargo.toml') }}
      - name: Install wasm-bindgen CLI
        if: steps.wbg.outputs.cache-hit != 'true'
        run: |
          pin="$(sed -nE 's/^wasm-bindgen = "=([0-9.]+)".*/\1/p' crates/wasm/Cargo.toml)"
          cargo install wasm-bindgen-cli --version "$pin" --locked

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Chromium for e2e
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: scripts/verify.sh

      # The e2e build is a `test`-mode build at base `/`; the deployed one is a normal build under the Pages path.
      - name: Build for Pages
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
