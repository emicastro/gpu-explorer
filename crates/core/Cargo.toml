[package]
name = "gpuviz-core"
description = "Analytical model of LLM inference on a GPU: data, fusion, roofline, tiling and timing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exports the TypeScript bindings to web/src/generated/ when tests run (ADR 0001).
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
serde_json = "1.0"
